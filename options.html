<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalesSnap — Settings & License</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 36px 16px;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 22px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; color: #34d399; }
    p.sub { margin: 0 0 18px; font-size: 13px; color: #94a3b8; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge.ok { background: #064e3b; color: #6ee7b7; }
    .badge.bad { background: #7f1d1d; color: #fca5a5; }
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    button {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-primary { background: #10b981; color: #052e16; }
    .btn-danger { background: #334155; color: #fca5a5; }
    .msg { margin-top: 12px; font-size: 13px; font-weight: 600; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ SalesSnap Settings</h1>
    <p class="sub">Workflows are cloud-managed and protected. Use the extension popup to activate or run automations.</p>
    <div class="row"><span>License Status</span><span id="opt-lic-status" class="badge bad">Checking...</span></div>
    <div class="row"><span>Plan</span><strong id="opt-lic-plan">-</strong></div>
    <div class="row"><span>Expires</span><strong id="opt-lic-exp">-</strong></div>
    <div class="actions">
      <button id="opt-sync-btn" type="button" class="btn-primary">↻ Sync Workflows</button>
      <button id="opt-lock-btn" type="button" class="btn-danger">🔓 Lock Device</button>
    </div>
    <div id="opt-msg" class="msg"></div>
  </div>
  <script src="/options-page.js"></script>
</body>
</html>
