<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات Help Seif</title><link rel="stylesheet" href="settings.css"></head><body><main class="shell"><header><a class="back" href="popup.html" aria-label="الرئيسية">←</a><div><p class="eyebrow">HELP SEIF</p><h1>الإعدادات</h1><p class="sub">خصص السلوك العام بعيدًا عن سير العمل.</p></div></header><section class="card"><h2>سرعة التنفيذ</h2><p>السرعة الأعلى تقلل الانتظار وقد تؤثر على استقرار بعض صفحات Salesforce.</p><label for="speed">مستوى السرعة</label><select id="speed"><option value="0.7">سريع</option><option value="1">عادي</option><option value="1.5">هادئ</option></select></section><section class="card"><h2>قيم سير العمل</h2><label class="setting"><span><b>Flexible Field 4 عند إتمام الصفقة</b><small>القيمة المستخدمة في مسار Won</small></span><span class="seg"><button type="button" data-field4="CC">CC</button><button type="button" data-field4="CS">CS</button></span></label><label class="setting"><span><b>تخطي تغيير المالك عند التطابق</b><small>اتركه فارغًا لتعطيل التخطي</small></span><input id="owner" type="text" placeholder="اسم المالك"></label><label class="setting"><span><b>لاحقة SMS ID</b><small>تضاف عند نسخ رقم SMS</small></span><input id="suffix" maxlength="6" placeholder="SE"></label></section><section class="card"><h2>شريط الاختصارات</h2><label class="switch-row"><span>إظهار الشريط العائم في Salesforce</span><input id="floating" type="checkbox"><i></i></label></section><a class="advanced" href="options.html#/settings/">إدارة workflows والإعدادات المتقدمة <span>←</span></a><p id="status" role="status" aria-live="polite"></p></main><script src="settings.js"></script></body></html>
