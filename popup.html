<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalesSnap</title>
  <link rel="stylesheet" href="/quickform-editor-controls.css">
</head>
<body class="flexi-body">
  <div class="flexi-popup" id="flexi-popup">
    <!-- 1. Header -->
    <header class="flexi-header">
      <div class="flexi-brand">
        <div class="flexi-logo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#FFFFFF">
            <path d="M13 2L3 14h8l-2 8 10-12h-8l2-8z"/>
          </svg>
        </div>
        <div class="flexi-titles">
          <h1 class="flexi-title">SalesSnap</h1>
          <p class="flexi-subtitle">CRM Automation <span class="flexi-version-badge">v1.18.0</span></p>
        </div>
      </div>
      <div class="flexi-header-actions">
        <button type="button" class="flexi-icon-btn" id="flexi-theme-btn" title="Switch Light / Dark theme" aria-label="Toggle theme">🌙</button>
        <button type="button" class="flexi-float-toggle active" id="flexi-float-toggle-btn" title="Show/Hide Floating Quick-Action Bar on Salesforce page" aria-label="Toggle Floating Bar">
          <span>⚡ Bar</span>
        </button>
        <button type="button" class="flexi-speed-pill" id="flexi-speed-btn" title="Change execution speed (Fast / 1x / Slow)" aria-label="Execution speed">
          <span class="flexi-status-dot"></span>
          <span class="flexi-status-text" id="flexi-speed-label">Fast</span>
        </button>
        <button type="button" class="flexi-icon-btn flexi-stop-btn" id="flexi-stop-btn" title="Stop running script immediately" aria-label="Stop running script">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <rect x="5" y="5" width="14" height="14" rx="2.5"></rect>
          </svg>
        </button>
        <button type="button" class="flexi-icon-btn" id="flexi-settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#17231D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button type="button" class="flexi-icon-btn" id="flexi-close-btn" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#17231D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- License Gate (shown when subscription is not active) -->
    <div class="flexi-license-gate" id="flexi-license-gate">
      <div class="flexi-gate-icon">🔐</div>
      <h2 class="flexi-gate-title">Activate SalesSnap</h2>
      <p class="flexi-gate-desc">Enter your subscription license key to unlock CRM workflows and the floating quick bar.</p>
      <input type="text" id="flexi-license-input" class="flexi-gate-input" placeholder="SNAP-XXXX-XXXX-XXXX" autocomplete="off" />
      <details class="flexi-gate-server-wrap">
        <summary>License Server URL (Advanced)</summary>
        <input type="url" id="flexi-license-server" class="flexi-gate-input" placeholder="https://salessnap-license-api.your-subdomain.workers.dev" />
      </details>
      <button type="button" id="flexi-activate-btn" class="flexi-gate-btn">Activate License</button>
      <div id="flexi-license-error" class="flexi-gate-error"></div>
    </div>

    <!-- 1b. Customer Info Copy Card (Collapsible) -->
    <section class="flexi-customer-card flexi-collapsible-sec" id="flexi-customer-card">
      <div class="flexi-customer-header">
        <button type="button" class="flexi-sec-toggle-btn" id="flexi-sec-cust-toggle" title="Collapse / Expand Customer Queue" aria-expanded="true">
          <span class="flexi-sec-chevron">▾</span>
          <span class="flexi-customer-title">Customer Queue</span>
          <span class="flexi-customer-hint">(Win+V)</span>
        </button>
        <div class="flexi-customer-actions">
          <div class="flexi-suffix-box" title="Letters added after SMS ID (e.g. SE or MY)">
            <span class="flexi-suffix-lbl">ID+</span>
            <input type="text" id="flexi-id-suffix" class="flexi-suffix-input" maxlength="6" value="SE" placeholder="SE" aria-label="SMS ID Suffix" />
          </div>
          <button type="button" id="flexi-cust-refresh" class="flexi-cust-refresh-btn" title="Auto-hover Account & refresh customer data" aria-label="Refresh customer data">↻</button>
          <button type="button" id="flexi-cust-copy-all" class="flexi-cust-copy-all-btn" title="Copy ID, Email, Phone & Name separately into Clipboard Queue">📋 Copy All</button>
        </div>
      </div>
      <div class="flexi-sec-body" id="flexi-sec-cust-body">
        <div class="flexi-customer-grid">
          <button type="button" class="flexi-cust-row" data-cust-field="name" title="Click to copy Name only">
            <span class="flexi-cust-lbl">1. Name (Top)</span>
            <span class="flexi-cust-val is-empty" id="flexi-cust-name">—</span>
          </button>
          <button type="button" class="flexi-cust-row" data-cust-field="phone" title="Click to copy Phone only">
            <span class="flexi-cust-lbl">2. Phone</span>
            <span class="flexi-cust-val is-empty" id="flexi-cust-phone">—</span>
          </button>
          <button type="button" class="flexi-cust-row" data-cust-field="email" title="Click to copy Email only">
            <span class="flexi-cust-lbl">3. Email</span>
            <span class="flexi-cust-val is-empty" id="flexi-cust-email">—</span>
          </button>
          <button type="button" class="flexi-cust-row" data-cust-field="smsId" title="Click to copy Student SMS ID + Suffix">
            <span class="flexi-cust-lbl">4. SMS ID (Bottom)</span>
            <span class="flexi-cust-val is-empty" id="flexi-cust-smsId">—</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 2. Flexible Fields & Owner Skip Section (Collapsible) -->
    <section class="flexi-field-card flexi-collapsible-sec" id="flexi-field-card">
      <div class="flexi-sec-header-bar">
        <button type="button" class="flexi-sec-toggle-btn" id="flexi-sec-fields-toggle" title="Collapse / Expand Fields & Owner Settings" aria-expanded="true">
          <span class="flexi-sec-chevron">▾</span>
          <span class="flexi-field-label">Fields &amp; Owner Skip</span>
        </button>
        <span class="flexi-sec-summary-pill" id="flexi-fields-summary">Won: CC • Seif Ezz Eldin</span>
      </div>

      <div class="flexi-sec-body" id="flexi-sec-fields-body">
        <div class="flexi-field-row">
          <div class="flexi-select-wrapper">
            <select id="qfe-flex-value" class="flexi-select" aria-label="Flexible Field 3 Value" title="Flexible Field 3 Value"></select>
            <div class="flexi-select-arrow" aria-hidden="true">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="#17231D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 7.5L10 12.5L15 7.5"/>
              </svg>
            </div>
          </div>
          <button type="button" id="qfe-flex-add" class="flexi-field-action-btn flexi-field-add-btn" title="Add new Flex Field 3 option" aria-label="Add new option">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <button type="button" id="qfe-flex-del" class="flexi-field-action-btn flexi-field-del-btn" title="Delete selected Flex Field 3 option" aria-label="Delete selected option">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <!-- Inline Add Option Input Row -->
        <div class="flexi-inline-add" id="qfe-flex-inline-add" hidden>
          <input type="text" id="qfe-flex-new-input" class="flexi-inline-input" placeholder="Enter new option..." autocomplete="off" />
          <button type="button" id="qfe-flex-save-btn" class="flexi-inline-btn flexi-inline-save" title="Save">Save</button>
          <button type="button" id="qfe-flex-cancel-btn" class="flexi-inline-btn flexi-inline-cancel" title="Cancel">✕</button>
        </div>

        <!-- Flexible Field 4 Value (Won: CC / CS) -->
        <div class="flexi-field4-row">
          <div class="flexi-field4-left">
            <span class="flexi-field4-badge">Won</span>
            <span class="flexi-field4-label">Flexible Field 4 Value</span>
          </div>
          <div class="flexi-seg-group" role="group" aria-label="Flexible Field 4 Value">
            <button type="button" id="qfe-flex4-cc" class="flexi-seg-btn active" data-value="CC" title="Set Flexible Field 4 Value to CC">CC</button>
            <button type="button" id="qfe-flex4-cs" class="flexi-seg-btn" data-value="CS" title="Set Flexible Field 4 Value to CS">CS</button>
          </div>
        </div>

        <!-- Skip Owner Change If Record Owner Matches -->
        <div class="flexi-owner-skip-row" title="If the Opportunity is already owned by this name, Change Owner steps will be skipped automatically">
          <div class="flexi-field4-left">
            <span class="flexi-owner-badge">Owner</span>
            <label for="qfe-owner-skip-input" class="flexi-field4-label">Skip If Owned By</label>
          </div>
          <input type="text" id="qfe-owner-skip-input" class="flexi-owner-skip-input" value="Seif Ezz Eldin" placeholder="Owner name..." autocomplete="off" />
        </div>

        <!-- Review Mode (Pause Before Final Save) -->
        <div class="flexi-review-row" title="Fill all fields and pause right before clicking Save so you can review">
          <div class="flexi-field4-left">
            <span class="flexi-review-badge">Safe</span>
            <span class="flexi-field4-label">Review Before Save</span>
          </div>
          <button type="button" id="qfe-review-toggle" class="flexi-switch-btn" role="switch" aria-checked="false">OFF</button>
        </div>
      </div>
    </section>

    <!-- 3. Automation Scripts Section (Collapsible + Compact Grid/List Toggle) -->
    <section class="flexi-wf-section flexi-collapsible-sec" id="flexi-wf-section">
      <div class="flexi-wf-sec-header">
        <button type="button" class="flexi-sec-toggle-btn" id="flexi-sec-wf-toggle" title="Collapse / Expand Workflows" aria-expanded="true">
          <span class="flexi-sec-chevron">▾</span>
          <span class="flexi-customer-title">Workflows</span>
        </button>
        <button type="button" class="flexi-view-mode-btn" id="flexi-wf-view-toggle" title="Switch between Compact 2-Column Grid and Full List view">
          ⊞ Compact Grid
        </button>
      </div>
      <div class="flexi-sec-body" id="flexi-sec-wf-body">
        <main class="flexi-scripts-list is-compact-grid" id="flexi-scripts-list" aria-label="Automation scripts">
          <!-- Script rows rendered dynamically by quickform-editor-controls.js -->
        </main>
      </div>
    </section>

    <footer class="flexi-footer">
      <div class="flexi-footer-hint">
        <span id="flexi-license-badge" class="flexi-lic-badge">PRO</span>
        <span>Keys: <b>1-9</b> Run • <b>C</b> Copy • <b>S</b> Stop</span>
      </div>
      <div class="flexi-footer-actions">
        <button type="button" id="flexi-export-btn" class="flexi-mini-btn" title="Export workflows & settings as JSON">⬇ Export</button>
        <button type="button" id="flexi-import-btn" class="flexi-mini-btn" title="Import workflows & settings from JSON">⬆ Import</button>
        <button type="button" id="flexi-deactivate-btn" class="flexi-mini-btn" title="Deactivate license on this device">🔓 Lock</button>
        <input type="file" id="flexi-import-file" accept=".json,application/json" hidden />
      </div>
    </footer>

    <div id="flexi-toast" class="flexi-toast" role="status" aria-live="polite"></div>
  </div>

  <script src="/quickform-editor-controls.js"></script>
</body>
</html>
